[workspace]
resolver = "3"
members = ["cli", "client", "mcp"]

[workspace.package]
rust-version = "1.96.0"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
reqwest = { version = "0.13.4", features = ["native-tls-vendored", "json"] }
rmcp = { version = "3.1.2", features = ["transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "signal",
] }
tokio-util = "0.7.19"
thiserror = "2.0.20"
derive_builder = "0.20.2"
httpmock = "0.8.3"
http-body-util = "0.1.5"
tower-http = "0.7.1"
tower = { version = "0.5.3", features = ["util"] }
